# Replace every selector/namespace placeholder with observed deployment values.
# This additive policy preserves the existing gateway ingress, Redis and DNS rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: realtimestack-central-https-egress
  namespace: replace-with-workload-namespace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: replace-with-gateway-selector
      app.kubernetes.io/instance: replace-with-release-name
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: replace-with-ingress-namespace
          podSelector:
            matchLabels:
              app.kubernetes.io/name: replace-with-ingress-pod-selector
      ports:
        # Use the observed ingress pod target port after Service DNAT.
        - { protocol: TCP, port: 8443 }
