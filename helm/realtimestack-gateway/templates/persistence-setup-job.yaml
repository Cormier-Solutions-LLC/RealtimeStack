{{- if and .Values.persistence.enabled .Values.persistence.setupJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-setup-%v" (include "realtimestack-gateway.fullname" . | trunc 43 | trimSuffix "-") .Release.Revision | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "realtimestack-gateway.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.persistence.setupJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.persistence.setupJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "realtimestack-gateway.name" . }}
        app.kubernetes.io/instance: {{ printf "%s-setup" .Release.Name | quote }}
        realtimestack-role: setup
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "realtimestack-gateway.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: setup
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--realtimestack-setup"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef: { name: {{ include "realtimestack-gateway.fullname" . }} }
          env:
            # Setup needs only the database. Do not provision unrelated diagnostics or metrics credentials.
            - { name: Diagnostics__Enabled, value: "false" }
            - { name: Metrics__Enabled, value: "false" }
            - { name: RealtimeStackSetup__Persistence__ApiEnabled, value: "false" }
            - name: ConnectionStrings__RealtimeStackPersistence
              valueFrom:
                secretKeyRef: { name: {{ .Values.persistence.connectionSecret.name }}, key: {{ .Values.persistence.connectionSecret.key }} }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
{{- end }}
