apiVersion: v1
kind: Service
metadata:
  name: {{ include "realtimestack-gateway.fullname" . }}
  labels:
    {{- include "realtimestack-gateway.labels" . | nindent 4 }}
    {{- with .Values.observability.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "realtimestack-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
