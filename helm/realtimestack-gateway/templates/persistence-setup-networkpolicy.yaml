{{- if and .Values.networkPolicy.enabled .Values.persistence.enabled .Values.persistence.setupJob.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "realtimestack-gateway.fullname" . }}-setup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ printf "%s-setup" .Release.Name | quote }}
      realtimestack-role: setup
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        {{- if not (empty .Values.persistence.egress.namespaceSelector) }}
        - namespaceSelector: {{ toYaml .Values.persistence.egress.namespaceSelector | nindent 12 }}
          {{- if not (empty .Values.persistence.egress.podSelector) }}
          podSelector: {{ toYaml .Values.persistence.egress.podSelector | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- range .Values.persistence.egress.cidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        {{- range .Values.persistence.egress.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
