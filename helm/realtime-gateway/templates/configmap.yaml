{{- if .Values.persistence.enabled }}
{{- if and (not (has .Values.persistence.provider (list "PostgreSql" "CockroachDb" "Sqlite"))) (not .Values.persistence.customProviderImage) }}
{{- fail "This persistence provider requires a custom gateway image registering its ADO.NET driver; set persistence.customProviderImage explicitly" }}
{{- end }}
{{- if and (eq .Values.persistence.provider "Sqlite") (or (ne .Values.topology "non-ha") (ne (int .Values.replicaCount) 1) .Values.autoscaling.enabled (empty .Values.persistence.storage.existingClaim) .Values.persistence.setupJob.enabled) }}
{{- fail "SQLite requires non-ha, one replica, disabled autoscaling, an existing PVC, and a schema initialized before rollout (setupJob disabled)" }}
{{- end }}
{{- if and .Values.networkPolicy.enabled (ne .Values.persistence.provider "Sqlite") (or (empty .Values.persistence.egress.ports) (and (empty .Values.persistence.egress.namespaceSelector) (empty .Values.persistence.egress.cidrs))) }}
{{- fail "Persistence requires explicit database egress selectors or CIDRs and ports when NetworkPolicy is enabled" }}
{{- end }}
{{- end }}
{{- if and .Values.diagnostics.enabled .Values.metrics.enabled .Values.metrics.authorizationPolicy (eq (lower .Values.diagnostics.authorizationPolicy) (lower .Values.metrics.authorizationPolicy)) }}
{{- fail "diagnostics.authorizationPolicy and metrics.authorizationPolicy must be distinct" }}
{{- end }}
{{- if and .Values.diagnostics.enabled .Values.metrics.enabled .Values.metrics.authorizationPolicy (eq .Values.diagnostics.operatorTokenSecret.name .Values.metrics.scrapeTokenSecret.name) (eq .Values.diagnostics.operatorTokenSecret.key .Values.metrics.scrapeTokenSecret.key) }}
{{- fail "diagnostics.operatorTokenSecret and metrics.scrapeTokenSecret must reference distinct Secret keys" }}
{{- end }}
{{- if gt (int .Values.diagnostics.minimumLogOverrideSeconds) (int .Values.diagnostics.maximumLogOverrideSeconds) }}
{{- fail "diagnostics.maximumLogOverrideSeconds must be greater than or equal to diagnostics.minimumLogOverrideSeconds" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  RealtimeSetup__GatewayEnabled: "true"
  RealtimeSetup__HttpFallbackEnabled: "true"
  RealtimeSetup__Persistence__Enabled: {{ .Values.persistence.enabled | quote }}
  RealtimeSetup__Persistence__Provider: {{ .Values.persistence.provider | quote }}
  RealtimeSetup__Persistence__TableName: {{ .Values.persistence.tableName | quote }}
  RealtimeSetup__Persistence__ConnectionStringName: "RealtimePersistence"
  RealtimeSetup__Persistence__CommandTimeoutSeconds: {{ .Values.persistence.commandTimeoutSeconds | quote }}
  RealtimeSetup__Persistence__ApiEnabled: {{ and .Values.persistence.enabled .Values.persistence.api.enabled | quote }}
  RealtimeSetup__Persistence__ApiBasePath: {{ .Values.persistence.api.basePath | quote }}
  name: {{ include "realtime-gateway.fullname" . }}
  labels:
    {{- include "realtime-gateway.labels" . | nindent 4 }}
data:
  Gateway__ServiceName: {{ include "realtime-gateway.fullname" . | quote }}
  Gateway__ShutdownDrainSeconds: {{ .Values.gateway.shutdownDrainSeconds | quote }}
  Gateway__DetailedHealthChecks: {{ .Values.gateway.detailedHealthChecks | quote }}
  Gateway__Topology: {{ .Values.topology | quote }}
  Realtime__EndpointPath: {{ .Values.ingressRoute.path | quote }}
  HttpFallback__BasePath: {{ .Values.ingressRoute.fallbackPath | quote }}
  Diagnostics__Enabled: {{ .Values.diagnostics.enabled | quote }}
  Diagnostics__ProductionEnabled: {{ .Values.diagnostics.productionEnabled | quote }}
  Diagnostics__BasePath: {{ .Values.diagnostics.basePath | quote }}
  Diagnostics__AuthorizationPolicy: {{ .Values.diagnostics.authorizationPolicy | quote }}
  Diagnostics__MaximumDetailItems: {{ .Values.diagnostics.maximumDetailItems | quote }}
  Diagnostics__MaximumConcurrentRequests: {{ .Values.diagnostics.maximumConcurrentRequests | quote }}
  Diagnostics__MaximumTailSessions: {{ .Values.diagnostics.maximumTailSessions | quote }}
  Diagnostics__TailBufferCapacity: {{ .Values.diagnostics.tailBufferCapacity | quote }}
  Diagnostics__TailEventsPerSecond: {{ .Values.diagnostics.tailEventsPerSecond | quote }}
  Diagnostics__TailBytesPerSecond: {{ .Values.diagnostics.tailBytesPerSecond | quote }}
  Diagnostics__MaximumTailDurationSeconds: {{ .Values.diagnostics.maximumTailDurationSeconds | quote }}
  Diagnostics__MinimumLogOverrideSeconds: {{ .Values.diagnostics.minimumLogOverrideSeconds | quote }}
  Diagnostics__MaximumLogOverrideSeconds: {{ .Values.diagnostics.maximumLogOverrideSeconds | quote }}
  Diagnostics__AuditCapacity: {{ .Values.diagnostics.auditCapacity | quote }}
  Diagnostics__AuditRetentionDays: {{ .Values.diagnostics.auditRetentionDays | quote }}
  Metrics__Enabled: {{ .Values.metrics.enabled | quote }}
  Metrics__Path: {{ .Values.metrics.path | quote }}
  Metrics__AuthorizationPolicy: {{ .Values.metrics.authorizationPolicy | quote }}
  Metrics__OtlpEnabled: {{ .Values.observability.otlp.enabled | quote }}
  {{- if .Values.observability.otlp.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otlp.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.observability.otlp.protocol | quote }}
  {{- end }}
  Redis__Endpoint: {{ include "realtime-gateway.redisEndpoint" . | quote }}
  Redis__SentinelServiceName: {{ ternary .Values.redis.sentinelServiceName "" (and (eq .Values.redis.mode "managed") (eq .Values.topology "ha")) | quote }}
  Redis__RequiredForReadiness: {{ .Values.redis.requiredForReadiness | quote }}
  Redis__InstancePrefix: {{ .Values.redis.instancePrefix | quote }}
  Redis__SessionKeyPrefix: {{ .Values.redis.sessionKeyPrefix | quote }}
  Redis__TicketKeyPrefix: {{ .Values.redis.ticketKeyPrefix | quote }}
  Redis__PubSubChannel: {{ .Values.redis.pubSubChannel | quote }}
  Redis__User: {{ .Values.redis.username | quote }}
  {{- range $index, $origin := .Values.gateway.allowedOrigins }}
  Realtime__AllowedOrigins__{{ $index }}: {{ $origin | quote }}
  {{- end }}
  {{- range $index, $network := .Values.gateway.trustedNetworks }}
  Proxy__TrustedNetworks__{{ $index }}: {{ $network | quote }}
  {{- end }}
  {{- range $index, $origin := .Values.diagnostics.allowedOrigins }}
  Diagnostics__AllowedOrigins__{{ $index }}: {{ $origin | quote }}
  {{- end }}
  {{- range $index, $network := .Values.diagnostics.allowedNetworks }}
  Diagnostics__AllowedNetworks__{{ $index }}: {{ $network | quote }}
  {{- end }}
  {{- range $index, $category := .Values.diagnostics.logCategoryAllowlist }}
  Diagnostics__LogCategoryAllowlist__{{ $index }}: {{ $category | quote }}
  {{- end }}
  {{- range $index, $network := .Values.metrics.allowedNetworks }}
  Metrics__AllowedNetworks__{{ $index }}: {{ $network | quote }}
  {{- end }}
