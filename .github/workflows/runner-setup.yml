name: Validate RealtimeStack runner setup

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'scripts/setup-ci-*.sh'
      - 'scripts/setup-ci-npm.mjs'
      - 'tests/bootstrap/runner-setup.test.mjs'
      - 'tests/bootstrap/preinstalled-tools.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'scripts/setup-ci-*.sh'
      - 'scripts/setup-ci-npm.mjs'
      - 'tests/bootstrap/runner-setup.test.mjs'
      - 'tests/bootstrap/preinstalled-tools.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; every other run completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-realtimestack-runner
        with:
          docker: 'true'
          native-aot: 'true'
          build-tools: 'true'
          shellcheck: 'true'
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
      - name: Verify workflow setup contracts
        run: node --test tests/bootstrap/runner-setup.test.mjs tests/bootstrap/preinstalled-tools.test.mjs
      - name: Verify installed capabilities
        run: |
          shellcheck --version
          clang --version
          cc --version
          make --version
          jq --version
          docker buildx version
          docker info >/dev/null
