name: Realtime gateway CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

# Superseded pull-request runs are cancelled; every main and manual run completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_INSTALL_DIR: ${{ vars.CI_DOTNET_INSTALL_DIR || '/home/runner/.dotnet' }}
  NPM_VERSION: 12.1.0
  CI_POWERSHELL_VERSION: ${{ vars.CI_POWERSHELL_VERSION || '7.6.6' }}
  CI_POWERSHELL_LINUX_X64_SHA256: ${{ vars.CI_POWERSHELL_LINUX_X64_SHA256 || 'ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc' }}
  CI_POWERSHELL_DOWNLOAD_BASE_URL: ${{ vars.CI_POWERSHELL_DOWNLOAD_BASE_URL || 'https://github.com/PowerShell/PowerShell/releases/download' }}
  CI_REDIS_IMAGE: ${{ vars.CI_REDIS_IMAGE }}
  CI_REDIS_BIND_ADDRESS: ${{ vars.CI_REDIS_BIND_ADDRESS || '0.0.0.0' }}
  CI_COMPOSER_IMAGE: ${{ vars.CI_COMPOSER_IMAGE }}
  CI_PYTHON_IMAGE: ${{ vars.CI_PYTHON_IMAGE }}
  CI_RUBY_IMAGE: ${{ vars.CI_RUBY_IMAGE }}
  CI_SWIFT_IMAGE: ${{ vars.CI_SWIFT_IMAGE }}
  CI_POWERSHELL_IMAGE: ${{ vars.CI_POWERSHELL_IMAGE }}
  CI_PROMETHEUS_IMAGE: ${{ vars.CI_PROMETHEUS_IMAGE }}
  CI_HELM_IMAGE: ${{ vars.CI_HELM_IMAGE }}
  CI_NODE_IMAGE: ${{ vars.CI_NODE_IMAGE }}
  CI_MAVEN_IMAGE: ${{ vars.CI_MAVEN_IMAGE }}
  CI_JAVA_IMAGE: ${{ vars.CI_JAVA_IMAGE }}
  CI_GRADLE_IMAGE: ${{ vars.CI_GRADLE_IMAGE }}
  CI_RUST_IMAGE: ${{ vars.CI_RUST_IMAGE }}
  CI_ALPINE_IMAGE: ${{ vars.CI_ALPINE_IMAGE }}
  CI_GO_IMAGE: ${{ vars.CI_GO_IMAGE }}
  CI_GO_CADDY_IMAGE: ${{ vars.CI_GO_CADDY_IMAGE }}
  CI_ELIXIR_IMAGE: ${{ vars.CI_ELIXIR_IMAGE }}
  CI_FRANKENPHP_BUILDER_IMAGE: ${{ vars.CI_FRANKENPHP_BUILDER_IMAGE }}
  CI_FRANKENPHP_IMAGE: ${{ vars.CI_FRANKENPHP_IMAGE }}
  CI_UV_IMAGE: ${{ vars.CI_UV_IMAGE }}
  CI_SWIFT_RUNTIME_IMAGE: ${{ vars.CI_SWIFT_RUNTIME_IMAGE }}

jobs:
  changes:
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 15
    outputs:
      selected: ${{ steps.impact.outputs.selected }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-realtime-runner
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
      - name: Install pinned npm
        run: node scripts/setup-ci-npm.mjs
      - name: Select affected validation jobs
        id: impact
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-impact.mjs select

  helm-and-automation:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected), 'helm-and-automation')
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-realtime-runner
        with:
          docker: 'true'
          shellcheck: 'true'
      - name: Authenticate to configured image registry
        if: vars.CI_IMAGE_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.CI_IMAGE_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Pull Prometheus validation image
        run: bash scripts/pull-ci-image.sh "$CI_PROMETHEUS_IMAGE"
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
      - name: Install pinned npm
        run: node scripts/setup-ci-npm.mjs
      - name: Install pinned PowerShell
        run: bash scripts/setup-ci-powershell.sh
      - name: Parse PowerShell lifecycle scripts
        run: |
          docker run --rm -v "$PWD:/work" -w /work --entrypoint pwsh-preview "$CI_POWERSHELL_IMAGE" -NoLogo -NoProfile -Command '
            $failed = $false
            Get-ChildItem /work/scripts -Filter "*.ps1" | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) { $errors | Format-List; $failed = $true }
            }
            if ($failed) { exit 1 }
          '
      - name: Analyze PowerShell entry point
        shell: pwsh
        run: |
          if (-not (Get-Module PSScriptAnalyzer -ListAvailable | Where-Object Version -EQ '1.24.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          }
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force
          $findings = Invoke-ScriptAnalyzer -Path ./scripts/Realtime-Bootstrap.ps1 -Severity Error,Warning
          if ($findings) { $findings | Format-Table -AutoSize; exit 1 }
          if (-not (Get-Module Pester -ListAvailable | Where-Object Version -EQ '5.7.1')) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          }
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          Invoke-Pester ./tests/bootstrap/Realtime-Bootstrap.Tests.ps1 -CI
      - name: Validate Bash syntax and static analysis
        run: |
          bash -n scripts/realtime-bootstrap.sh
          bash -n scripts/realtime-redis-secret.sh
          bash -n scripts/realtime-certificate.sh
          bash -n scripts/prepare-managed-redis-chart.sh
          shellcheck scripts/realtime-bootstrap.sh scripts/realtime-redis-secret.sh scripts/realtime-certificate.sh scripts/prepare-managed-redis-chart.sh
      - name: Test bootstrap contract and cross-shell parity
        env:
          BOOTSTRAP_SKIP_LIFECYCLE: '1'
        run: node --test tests/bootstrap/*.test.mjs
      - name: Render both explicit bootstrap topology profiles
        run: |
          node scripts/realtime-bootstrap.mjs plan --config bootstrap/config.example.json --profile non-ha
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-non-ha helm/realtime-gateway --namespace ci-realtime --values .bootstrap/env/dev/lifecycle/dev-realtime/values.json > /tmp/non-ha.yaml
          jq '.topology = "ha" | .kubernetes.failureDomains = 3' bootstrap/config.example.json > /tmp/bootstrap-ha.json
          node scripts/realtime-bootstrap.mjs plan --config /tmp/bootstrap-ha.json --profile ha
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-ha helm/realtime-gateway --namespace ci-realtime --values .bootstrap/env/dev/lifecycle/dev-realtime/values.json > /tmp/ha.yaml
          grep --quiet 'replicas: 1' /tmp/non-ha.yaml
          if grep --quiet 'kind: PodDisruptionBudget' /tmp/non-ha.yaml; then exit 1; fi
          grep --quiet 'Gateway__Topology: "non-ha"' /tmp/non-ha.yaml
          grep --quiet 'Redis__Endpoint: "dev-realtime-redis-master:6379"' /tmp/non-ha.yaml
          if grep --quiet 'Redis__SentinelPassword' /tmp/non-ha.yaml; then exit 1; fi
          grep --quiet 'replicas: 3' /tmp/ha.yaml
          grep --quiet 'kind: PodDisruptionBudget' /tmp/ha.yaml
          grep --quiet 'topologySpreadConstraints:' /tmp/ha.yaml
          grep --quiet 'whenUnsatisfiable: DoNotSchedule' /tmp/ha.yaml
          grep --quiet 'Gateway__Topology: "ha"' /tmp/ha.yaml
          grep --quiet 'Redis__Endpoint: "dev-realtime-redis:26379,sentinelUser=default"' /tmp/ha.yaml
          grep --quiet 'Redis__SentinelPassword' /tmp/ha.yaml
          grep --quiet 'port: 6379' /tmp/ha.yaml
          grep --quiet 'port: 26379' /tmp/ha.yaml
      - name: Helm lint, schema, and render validation
        run: |
          node scripts/test-persistence-chart.mjs --docker-image="$CI_HELM_IMAGE"
          jq --exit-status '.templating.list | map(.name) == ["environment","cluster","namespace","instance","pod"]' helm/realtime-gateway/dashboards/realtime-gateway.json
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" lint helm/realtime-gateway --strict
          if docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template invalid-ip helm/realtime-gateway --set observability.prometheusRule.ingressEnabled=true --set-string observability.platformMetrics.metalLbAddress=':::' >/tmp/invalid-ip.yaml 2>/tmp/invalid-ip.err; then
            echo 'Helm schema accepted an invalid IPv6 MetalLB address.' >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-realtime helm/realtime-gateway --namespace ci-realtime > /tmp/external.yaml
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-realtime helm/realtime-gateway --namespace ci-realtime --values cluster/redis/managed-gateway-values.example.yaml > /tmp/managed.yaml
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-realtime helm/realtime-gateway --namespace ci-realtime --api-versions monitoring.coreos.com/v1/ServiceMonitor --api-versions monitoring.coreos.com/v1/PrometheusRule --api-versions monitoring.coreos.com/v1alpha1/AlertmanagerConfig --set observability.alertmanagerConfig.enabled=true --set observability.alertmanagerConfig.webhookSecret.name=ci-alert-webhook --set autoscaling.connectionsMetric.enabled=true --set autoscaling.queueDepthMetric.enabled=true --set metrics.authorizationPolicy=ci-metrics --set metrics.scrapeTokenSecret.name=ci-metrics > /tmp/observability.yaml
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template ci-realtime helm/realtime-gateway --namespace ci-realtime --set diagnostics.enabled=true --set diagnostics.productionEnabled=true --set diagnostics.authorizationPolicy=ci-operator --set diagnostics.operatorTokenSecret.name=ci-diagnostics --set 'diagnostics.allowedNetworks[0]=192.0.2.0/24' --set observability.otlp.enabled=true --set observability.otlp.endpoint=https://otel.example --set 'observability.otlp.egressCidrs[0]=192.0.2.0/24' --set observability.otlp.headersSecret.name=ci-otel > /tmp/diagnostics.yaml
          grep --quiet 'kind: Deployment' /tmp/external.yaml
          grep --quiet 'kind: NetworkPolicy' /tmp/managed.yaml
          grep --quiet 'kind: ServiceMonitor' /tmp/observability.yaml
          grep --quiet 'Metrics__ScrapeToken' /tmp/observability.yaml
          grep --quiet 'name: ci-metrics' /tmp/observability.yaml
          grep --quiet 'kind: PrometheusRule' /tmp/observability.yaml
          grep --quiet 'kind: AlertmanagerConfig' /tmp/observability.yaml
          grep --quiet 'realtime_active_connections' /tmp/observability.yaml
          grep --quiet 'Diagnostics__ProductionEnabled: "true"' /tmp/diagnostics.yaml
          grep --quiet 'Diagnostics__OperatorToken' /tmp/diagnostics.yaml
          grep --quiet 'name: ci-diagnostics' /tmp/diagnostics.yaml
          grep --quiet 'OTEL_EXPORTER_OTLP_HEADERS' /tmp/diagnostics.yaml
          grep --quiet 'secretKeyRef' /tmp/diagnostics.yaml
          jq --exit-status '.contractVersion and (.metrics | length > 20) and ([.metrics[].labels[]] | all(. != "tenant_id" and . != "user_id" and . != "session_id"))' observability/metrics-catalog.json
          mkdir -p artifacts/helm
          awk '/kind: PrometheusRule/{found=1} found && /^spec:/{in_spec=1;next} in_spec && /^---/{exit} in_spec {sub(/^  /,"");print}' /tmp/observability.yaml > artifacts/helm/prometheus-rules.yaml
          docker run --rm -v "$PWD:/work" -w /work --entrypoint promtool "$CI_PROMETHEUS_IMAGE" check rules artifacts/helm/prometheus-rules.yaml
      - name: Render pinned managed Redis topology
        run: |
          helm_container=$(docker create "$CI_HELM_IMAGE")
          trap 'docker rm -f "$helm_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$helm_container:/usr/bin/helm" /tmp/realtime-helm
          docker rm "$helm_container" >/dev/null
          trap - EXIT
          chmod +x /tmp/realtime-helm
          node scripts/prepare-managed-redis-chart.mjs \
            --chart oci://registry-1.docker.io/bitnamicharts/redis \
            --version 23.1.1 \
            --archive-sha256 sha256:05665707e771f9ed843842d3ebacb992ef1c4089f138b9711446b37db76ad60a \
            --output .bootstrap/ci-redis-chart \
            --helm /tmp/realtime-helm
          docker run --rm -v "$PWD:/work" -w /work "$CI_HELM_IMAGE" template dev-realtime-redis .bootstrap/ci-redis-chart/redis --namespace ci-realtime --values cluster/redis/managed-values.yaml --values .bootstrap/env/dev/lifecycle/dev-realtime/redis-values.json > /tmp/redis.yaml
          grep --quiet 'kind: StatefulSet' /tmp/redis.yaml
          grep --quiet 'kind: PodDisruptionBudget' /tmp/redis.yaml
          grep --quiet 'kind: NetworkPolicy' /tmp/redis.yaml
          grep --quiet 'topologyKey: topology.kubernetes.io/zone' /tmp/redis.yaml
          grep --quiet 'whenUnsatisfiable: DoNotSchedule' /tmp/redis.yaml
          test "$(grep -c 'publishNotReadyAddresses: true' /tmp/redis.yaml)" -eq 2
          grep --quiet 'podManagementPolicy: "OrderedReady"' /tmp/redis.yaml
          test "$(grep -c 'failureThreshold: 60' /tmp/redis.yaml)" -ge 2
          grep --quiet 'name: single-request-reopen' /tmp/redis.yaml
          grep --quiet 'SENTINEL DEBUG tilt-trigger 10000' /tmp/redis.yaml
          grep --quiet 'bitnamilegacy/redis@sha256:25bf63f3caf75af4628c0dfcf39859ad1ac8abe135be85e99699f9637b16dc28' /tmp/redis.yaml
          grep --quiet 'bitnamilegacy/redis-sentinel@sha256:0ca3ea1d2f823c2d9265e0d9e682dc435f219f8d3385aed75b5bb0f365f516a9' /tmp/redis.yaml
          grep --quiet 'bitnamilegacy/redis-exporter@sha256:d111b8a14d96f7edd67324776d6801b76023035d9390d03fbb13d1c21bda8b88' /tmp/redis.yaml

  bootstrap-powershell-windows:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected), 'bootstrap-powershell-windows')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
      - name: Install pinned npm
        run: node scripts/setup-ci-npm.mjs
      - name: Test shared contract on Windows
        env:
          BOOTSTRAP_SKIP_LIFECYCLE: '1'
        run: node --test tests/bootstrap/*.test.mjs
      - name: Test PowerShell entry point on Windows
        shell: pwsh
        run: |
          if (-not (Get-Module Pester -ListAvailable | Where-Object Version -EQ '5.7.1')) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          }
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          Invoke-Pester ./tests/bootstrap/Realtime-Bootstrap.Tests.ps1 -CI

  bootstrap-lifecycle-parity:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected), 'bootstrap-lifecycle-parity')
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]
        profile: [non-ha, ha]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-realtime-runner
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
      - name: Install pinned npm
        run: node scripts/setup-ci-npm.mjs
      - name: Install pinned PowerShell
        run: bash scripts/setup-ci-powershell.sh
      - name: Exercise lifecycle with failure injection
        env:
          BOOTSTRAP_TEST_SHELLS: ${{ matrix.shell }}
          BOOTSTRAP_TEST_PROFILES: ${{ matrix.profile }}
        run: node --test --test-name-pattern="complete lifecycle" tests/bootstrap/bootstrap-contract.test.mjs

  build-test-aot:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected), 'build-test-aot')
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-realtime-runner
        with:
          docker: 'true'
          native-aot: 'true'
      - name: Authenticate to configured image registry
        if: vars.CI_IMAGE_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.CI_IMAGE_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Pull Prometheus validation image
        run: bash scripts/pull-ci-image.sh "$CI_PROMETHEUS_IMAGE"
      - name: Start configured Redis fixture
        id: redis_fixture
        run: bash scripts/start-ci-redis.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install pinned npm
        run: node scripts/setup-ci-npm.mjs
      - name: Install pinned PowerShell
        run: bash scripts/setup-ci-powershell.sh
      - name: Restore TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: Restore locked dependencies
        run: dotnet restore Realtime.sln --runtime linux-x64 --locked-mode
      - name: Build
        run: dotnet build Realtime.sln --configuration Release --no-restore
      - name: Validate clean ASP.NET Core package consumer
        shell: pwsh
        env:
          NUGET_UPSTREAM_SOURCE: https://api.nuget.org/v3/index.json
        run: ./scripts/Test-AspNetCorePackage.ps1
      - name: Validate clean .NET client package consumers
        shell: pwsh
        env:
          NUGET_UPSTREAM_SOURCE: https://api.nuget.org/v3/index.json
        run: ./scripts/Test-DotNetClientPackage.ps1
      - name: Validate clean browser package consumer
        shell: pwsh
        env:
          NUGET_UPSTREAM_SOURCE: https://api.nuget.org/v3/index.json
        run: ./scripts/Test-BrowserPackage.ps1
      - name: Test
        env:
          REDIS_TEST_ENDPOINT: localhost:6379
        run: dotnet test Realtime.sln --configuration Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Verify OTLP and Prometheus ingestion
        run: bash scripts/verify-observability.sh
      - name: Validate TypeScript SDK and reproducible browser artifacts
        working-directory: sdk/typescript
        run: |
          npm run check
          git diff --exit-code -- dist ../../examples/shared-web/dist
          npm pack --dry-run
      - name: Install browser test engines
        working-directory: sdk/typescript
        run: bash ../../scripts/setup-ci-playwright.sh chromium firefox webkit
      - name: Cross-browser SDK and live gateway tests
        working-directory: sdk/typescript
        env:
          REDIS_TEST_ENDPOINT: localhost:6379
        run: npm run test:browser
      - name: Native AOT publish
        run: dotnet publish src/Realtime.Gateway --configuration Release --runtime linux-x64 --self-contained --no-restore --output artifacts/native
      - name: Smoke-test Native AOT executable
        env:
          ASPNETCORE_URLS: http://127.0.0.1:8080
          Gateway__ShutdownDrainSeconds: '1'
          Redis__Endpoint: localhost:6379
          Realtime__AllowedOrigins__0: http://127.0.0.1:8080
        run: |
          artifacts/native/Realtime.Gateway > artifacts/native-smoke.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat artifacts/native-smoke.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/health/startup >/dev/null
          curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:8080/metrics | grep --quiet realtime_health_requests_total
          curl --fail --silent http://127.0.0.1:8080/metrics | docker run --rm --interactive --entrypoint promtool "$CI_PROMETHEUS_IMAGE" check metrics
          curl --fail --silent --header 'Accept: application/openmetrics-text; version=1.0.0' http://127.0.0.1:8080/metrics | tee /tmp/openmetrics.txt | docker run --rm --interactive --entrypoint promtool "$CI_PROMETHEUS_IMAGE" check metrics
          tail --lines 1 /tmp/openmetrics.txt | grep --quiet '^# EOF$'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/diagnostics/v1/snapshot)" = "404"
      - name: Create OCI archive with .NET SDK
        run: dotnet publish src/Realtime.Gateway --configuration Release --runtime linux-x64 --self-contained --no-restore /t:PublishContainer /p:ContainerArchiveOutputPath=${{ github.workspace }}/artifacts/realtime-gateway.tar.gz
      - name: Smoke-test rootless read-only OCI image
        id: container-smoke
        run: |
          load_output=$(docker load --input artifacts/realtime-gateway.tar.gz)
          printf '%s\n' "$load_output"
          image_ref=$(printf '%s\n' "$load_output" | sed -n 's/^Loaded image: //p' | tail -n 1)
          if [ -z "$image_ref" ]; then
            echo "Unable to determine the loaded OCI image reference."
            exit 1
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          configured_user=$(docker image inspect --format '{{.Config.User}}' "$image_ref")
          test "$configured_user" = "1654"

          container_name="realtime-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container_name" \
            --user 1654:1654 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --add-host host.docker.internal:host-gateway \
            --env Redis__Endpoint=host.docker.internal:6379 \
            --env Realtime__AllowedOrigins__0=http://127.0.0.1:18080 \
            --publish 127.0.0.1:18080:8080 \
            "$image_ref"

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container_name"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:18080/health/startup >/dev/null
          curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:18080/metrics | grep --quiet realtime_health_requests_total
      - name: Scan source and artifacts
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: artifacts/trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Scan deployable OCI archive
        if: ${{ always() && hashFiles('artifacts/realtime-gateway.tar.gz') != '' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: artifacts/realtime-gateway.tar.gz
          format: sarif
          output: artifacts/trivy-image.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Upload filesystem scan results
        if: ${{ always() && hashFiles('artifacts/trivy-filesystem.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-filesystem.sarif
          category: trivy-filesystem
      - name: Upload image scan results
        if: ${{ always() && hashFiles('artifacts/trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-image.sarif
          category: trivy-image
      - name: Generate SBOM
        if: ${{ always() && steps.container-smoke.outputs.image_ref != '' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.container-smoke.outputs.image_ref }}
          artifact-name: realtime-gateway-sbom.spdx.json
          output-file: artifacts/realtime-gateway.spdx.json
          format: spdx-json
      - name: Upload immutable build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: realtime-${{ github.sha }}
          path: |
            artifacts/native
            artifacts/realtime-gateway.tar.gz
            artifacts/test-results
            artifacts/trivy-filesystem.sarif
            artifacts/trivy-image.sarif
            artifacts/native-smoke.log
            artifacts/realtime-gateway.spdx.json

