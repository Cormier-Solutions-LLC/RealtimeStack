      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install pinned npm
        run: node scripts/setup-ci-npm.mjs
      - name: Build the gateway fixture
        run: |
          dotnet restore examples/full-circle/Realtime.Example.FullCircle.csproj --locked-mode
          dotnet build examples/full-circle/Realtime.Example.FullCircle.csproj --configuration Release --no-restore
      - name: Build the canonical browser SDK
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build --silent
      - name: Check the locked FastAPI reference adapter
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo/examples/python-fastapi
          "$CI_PYTHON_IMAGE"
          sh -lc 'pip install --no-cache-dir uv==0.12.13 >/dev/null && uv sync --frozen && uv lock --check && uv run ruff check . && uv run ruff format --check . && uv run pytest && uv run pip-audit --local'
      - name: Build the FastAPI reference container
        run: >-
          docker build --build-arg UV_IMAGE="$CI_UV_IMAGE" --build-arg PYTHON_IMAGE="$CI_PYTHON_IMAGE"
          --file examples/python-fastapi/Dockerfile --tag realtime-python-fastapi:${{ github.sha }} .
      - name: Scan the FastAPI reference container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: realtime-python-fastapi:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Install Chromium
        working-directory: sdk/typescript
        run: bash ../../scripts/setup-ci-playwright.sh chromium
      - name: Run the shared browser smoke scenarios
        working-directory: sdk/typescript
        env:
          PYTHON_FASTAPI_IMAGE: realtime-python-fastapi:${{ github.sha }}
        run: npx playwright test --config playwright.python-fastapi.config.mjs
      - name: Upload FastAPI failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: python-fastapi-${{ github.sha }}
          path: artifacts/python-fastapi

