          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Install Chromium
        working-directory: sdk/typescript
        run: bash ../../scripts/setup-ci-playwright.sh chromium
      - name: Run the shared browser smoke scenarios
        working-directory: sdk/typescript
        run: npx playwright test --config playwright.node-express.config.mjs
