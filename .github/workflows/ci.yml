        working-directory: examples/node-express
        run: npm ci --ignore-scripts
      - name: Check the Express reference adapter
        working-directory: examples/node-express
        run: npm run check
      - name: Build the Express reference container
        run: >-
          docker build --build-arg NODE_IMAGE="$CI_NODE_IMAGE"
          --file examples/node-express/Dockerfile --tag realtime-node-express:${{ github.sha }} .
      - name: Scan the Express reference container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
