  swift-vapor:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected), 'swift-vapor')
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 60
    # The locked adapter test and the container build each compile the Vapor
    # dependency graph; run them on separate runners so they overlap.
    strategy:
      fail-fast: false
      matrix:
        part: [adapter, container]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-realtime-runner
        with:
          docker: 'true'
      - name: Authenticate to configured image registry
        if: vars.CI_IMAGE_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.CI_IMAGE_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Check the locked Vapor reference adapter
        if: matrix.part == 'adapter'
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo/examples/swift-vapor
          "$CI_SWIFT_IMAGE"
          sh -lc 'cp Package.resolved /tmp/Package.resolved && swift package resolve --disable-sandbox && diff -u /tmp/Package.resolved Package.resolved && swift format lint --recursive --strict Sources Tests Package.swift && swift test --disable-sandbox'
      - name: Start configured Redis fixture
        if: matrix.part == 'container'
        id: redis_fixture
        run: bash scripts/start-ci-redis.sh
      - uses: actions/setup-dotnet@v6
        if: matrix.part == 'container'
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux' && matrix.part == 'container'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        if: matrix.part == 'container'
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install pinned npm
        if: matrix.part == 'container'
        run: node scripts/setup-ci-npm.mjs
      - name: Build the gateway fixture
        if: matrix.part == 'container'
        run: |
          dotnet restore examples/full-circle/Realtime.Example.FullCircle.csproj --locked-mode
          dotnet build examples/full-circle/Realtime.Example.FullCircle.csproj --configuration Release --no-restore
      - name: Build the canonical browser SDK
        if: matrix.part == 'container'
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts && npm run build --silent
      - name: Set up Buildx with a layer cache
        if: matrix.part == 'container'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Vapor reference container
        if: matrix.part == 'container'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: examples/swift-vapor/Dockerfile
          build-args: |
            SWIFT_BUILD_IMAGE=${{ env.CI_SWIFT_IMAGE }}
            GO_IMAGE=${{ env.CI_GO_CADDY_IMAGE }}
            SWIFT_RUNTIME_IMAGE=${{ env.CI_SWIFT_RUNTIME_IMAGE }}
          tags: realtime-swift-vapor:${{ github.sha }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=swift-vapor
          cache-to: type=gha,scope=swift-vapor,mode=max
      - name: Scan the Vapor reference container
        if: matrix.part == 'container'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: realtime-swift-vapor:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Install Chromium
        if: matrix.part == 'container'
        working-directory: sdk/typescript
        run: bash ../../scripts/setup-ci-playwright.sh chromium
      - name: Run the shared browser smoke scenarios
        if: matrix.part == 'container'
        working-directory: sdk/typescript
        env:
          SWIFT_VAPOR_IMAGE: realtime-swift-vapor:${{ github.sha }}
        run: npx playwright test --config playwright.swift-vapor.config.mjs
      - name: Upload Vapor failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-vapor-${{ matrix.part }}-${{ github.sha }}
          path: artifacts/swift-vapor

  full-circle:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.selected), 'full-circle')
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 45
    env:
      REDIS_TEST_ENDPOINT: 127.0.0.1:6379
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]
        profile: [non-ha, ha]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-realtime-runner
        with:
          docker: 'true'
      - name: Authenticate to configured image registry
        if: vars.CI_IMAGE_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.CI_IMAGE_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Start configured Redis fixture
        id: redis_fixture
        run: bash scripts/start-ci-redis.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install pinned npm
        run: node scripts/setup-ci-npm.mjs
      - name: Install pinned PowerShell
        if: matrix.shell == 'pwsh'
        run: bash scripts/setup-ci-powershell.sh
      - name: Bootstrap through Bash
        if: matrix.shell == 'bash'
        run: bash ./scripts/full-circle.sh bootstrap --profile "${{ matrix.profile }}"
      - name: Bootstrap through PowerShell
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/FullCircle.ps1 -Action bootstrap -Profile '${{ matrix.profile }}'
      - name: Install Chromium
        working-directory: sdk/typescript
        run: bash ../../scripts/setup-ci-playwright.sh chromium
      - name: Validate through Bash
        if: matrix.shell == 'bash'
        run: bash ./scripts/full-circle.sh validate --profile "${{ matrix.profile }}"
      - name: Validate through PowerShell
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/FullCircle.ps1 -Action validate -Profile '${{ matrix.profile }}'
      - name: Upload full-circle failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-circle-${{ matrix.shell }}-${{ matrix.profile }}-${{ github.sha }}
          path: artifacts/full-circle
      - name: Clean full-circle fixtures through Bash
        if: always() && steps.redis_fixture.outcome == 'success' && matrix.shell == 'bash'
        run: bash ./scripts/full-circle.sh cleanup --profile "${{ matrix.profile }}"
      - name: Clean full-circle fixtures through PowerShell
        if: always() && steps.redis_fixture.outcome == 'success' && matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/FullCircle.ps1 -Action cleanup -Profile '${{ matrix.profile }}'

  ci-failed:
    if: ${{ always() }}
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 15
    needs:
      - changes
      - helm-and-automation
      - bootstrap-powershell-windows
      - bootstrap-lifecycle-parity
      - build-test-aot
      - dependency-review
      - node-express
      - java-spring-boot
      - kotlin-ktor
      - rust-axum
      - go-gin
      - elixir-phoenix
      - php-laravel
      - python-fastapi
      - ruby-rails
      - swift-vapor
      - full-circle
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-realtime-runner
      - name: Install Node runtime prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/setup-ci-node-prerequisites.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
      - name: Install pinned npm
        run: node scripts/setup-ci-npm.mjs
      - name: Require every affected CI validation job to pass
        env:
          CI_SELECTED_JOBS: ${{ needs.changes.outputs.selected }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-impact.mjs check
