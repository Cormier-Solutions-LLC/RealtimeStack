gateway:
  allowedOrigins:
    - https://realtime.example.test
  shutdownDrainSeconds: 25

networkPolicy:
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: traefik
  ingressPodSelector:
    matchLabels:
      app.kubernetes.io/name: traefik

ingressRoute:
  enabled: true
  host: realtime.example.test
  path: /realtime/ws
  tlsSecretName: realtime-local-tls
