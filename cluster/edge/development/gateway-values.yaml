gateway:
  allowedOrigins:
    - https://realtimestack.example.test
  shutdownDrainSeconds: 25

networkPolicy:
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: traefik
  ingressPodSelector:
    matchLabels:
      app.kubernetes.io/name: traefik

ingressRoute:
  enabled: true
  host: realtimestack.example.test
  path: /realtimestack/ws
  tlsSecretName: realtimestack-local-tls
