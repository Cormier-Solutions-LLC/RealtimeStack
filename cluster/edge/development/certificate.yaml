apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: realtimestack-local
  namespace: development-realtimestack
  labels:
    realtimestack.example/environment: development
spec:
  secretName: realtimestack-local-tls
  dnsNames:
    - realtimestack.example.test
  issuerRef:
    kind: ClusterIssuer
    name: realtimestack-local-ca
