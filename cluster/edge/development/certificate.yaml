apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: realtime-local
  namespace: development-realtime
  labels:
    realtime.example/environment: development
spec:
  secretName: realtime-local-tls
  dnsNames:
    - realtime.example.test
  issuerRef:
    kind: ClusterIssuer
    name: realtime-local-ca
